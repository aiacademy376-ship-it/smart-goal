name: SmartGoal validation

on:
  push:
    branches:
      - main
      - smartgoal/cloudflare-upgrade
      - smartgoal/production-integration
      - smartgoal/community-settings-refresh
      - smartgoal/full-localization-routing-quality
      - smartgoal/fix-route-init-selector
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --input-type=module --check < worker/index.js
          node --input-type=module --check < "functions/api/[[path]].js"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate responsive UI, multilingual AI and reward catalog
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          script = Path("script.js").read_text(encoding="utf-8")
          worker = Path("worker/index.js").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")

          assert css.count("{") == css.count("}"), "CSS braces are unbalanced"
          for breakpoint in ("max-width: 1100px", "max-width: 760px", "max-width: 430px", "max-width: 340px"):
              assert breakpoint in css, f"Missing responsive breakpoint: {breakpoint}"
          assert "prefers-reduced-motion: reduce" in css, "Reduced-motion support is missing"
          assert "viewport-fit=cover" in html, "Mobile safe-area viewport support is missing"
          assert "Interfeys murakkabligi" not in script, "Age-based interface complexity must stay removed"
          assert 'data-settings-tab="difficulty"' not in script, "Complexity settings tab must stay removed"
          assert "name='difficulty'" not in script and 'name="difficulty"' not in script, "Complexity selector must stay removed"
          assert 'data-setting="language"' in script and 'data-setting="fontSize"' in script, "Language and font-size settings must remain available"
          assert 'data-action="edit-birthdate"' in script and 'name="username"' in script, "Profile and birthday editing must remain available"
          assert "aiacademy376-ship-it.github.io" in html and "smart-goal.pages.dev" in html, "GitHub Pages canonical redirect is missing"

          for route in (
              'dashboard: "/"', 'goals: "/maqsadlar"', 'schedule: "/vazifalar"',
              'planner: "/kun-tartibi"', 'analytics: "/statistika"',
              'achievements: "/yutuqlar"', 'rewards: "/mukofotlar"',
              'community: "/hamjamiyat"', 'ai: "/suniy-intellekt"',
              'notifications: "/bildirishnomalar"', 'settings: "/sozlamalar"',
              'profile: "/profil"'
          ):
              assert route in script, f"Missing Uzbek application route: {route}"
          for legacy_route in (
              '"/goals": "goals"', '"/tasks": "schedule"',
              '"/statistics": "analytics"', '"/profile": "profile"'
          ):
              assert legacy_route in script, f"Missing legacy route alias: {legacy_route}"
          assert 'const canonicalInitialPath = PAGE_ROUTES[currentPage] || "/"' in script, "Old URLs must canonicalize to Uzbek routes"
          assert 'language: "uz"' in script, "Uzbek must remain the default interface language"
          assert 'window.addEventListener("popstate"' in script, "Browser back/forward routing is missing"
          assert '$$(".nav-link").forEach' in script, "Navigation state must use the multi-element selector"
          assert not re.search(r'(?<!\$)\$\("\.nav-link"\)\.forEach', script), "Navigation initialization uses a single-element selector"
          assert 'window.history[method]' in script, "Client-side route history is missing"
          for required_translation in (
              '"Hisobingizga kiring"', '"Username yoki elektron pochta"',
              '"Parolni unutdingizmi?"', '"ASOSIY"', '"RIVOJLANISH"',
              '"SHAXSIY"', '"Hisobdan chiqish"', '"SmartGoal yuklanmoqda..."'
          ):
              assert script.count(required_translation) >= 2, (
                  f"Missing Uzbek source translation pair: {required_translation}"
              )

          assert "translationOriginalText = new WeakMap()" in script, "Language switching source-text cache is missing"
          assert 'raw.trim().replace(/\\s+/g, " ")' in script, "Whitespace-safe translation lookup is missing"
          assert "function translateUIString(value" in script, "Shared UI message translator is missing"
          assert "messageElement.textContent = translateUIString(message)" in script, "Toast messages bypass localization"
          assert "Maqsad topildi:" in script and "Vazifa topildi:" in script, "Dynamic search-result messages are not localized"
          for translated_label in (
              '"Boshlovchi"', '"Afsona"', '"Birinchi qadam"',
              '"Kun tartibi ustasi"', '"Okean mavzusi"',
              '"Diqqat Pro belgisi"', '"AI javob yozmoqda..."',
              '"AI bilan bog‘lanib bo‘lmadi."'
          ):
              assert script.count(translated_label) >= 2, (
                  f"Missing RU/EN translation for UI label: {translated_label}"
              )
          assert 'name="estimatedMinutes"' in script and 'name="priority"' in script, "AI task-scoring inputs are missing"
          assert "async function generateDailyAdvice()" in script, "Personal AI coaching action is missing"
          assert "async function generateRoutine()" in script, "AI routine builder is missing"
          assert "45 XP" not in script and "45-COALESCE" not in worker, "A daily XP cap is still present"
          assert "rawDifficulty=scoreValue" in worker, "Robust AI score parsing is missing"
          assert "Vazifa nomi va izohi o‘zbek, rus, ingliz yoki boshqa tilda" in worker, "Multilingual task evaluation is missing"

          store_start = script.index("const STORE_ITEMS")
          store_end = script.index("const ACHIEVEMENTS", store_start)
          catalog_start = worker.index("const STORE_CATALOG")
          catalog_end = worker.index("async function handleStorePurchase", catalog_start)
          store_source = script[store_start:store_end]
          server_catalog_source = worker[catalog_start:catalog_end]
          js_items = dict((item_id, int(price)) for item_id, price in re.findall(
              r'id:\s*"([^"]+)"[\s\S]*?price:\s*(\d+)', store_source
          ))
          worker_catalog = dict((item_id, int(price)) for item_id, price in re.findall(
              r'"([^"]+)":\{price:(\d+),type:', server_catalog_source
          ))
          assert js_items, "Frontend reward catalog could not be read"
          assert js_items == worker_catalog, (
              f"Frontend/server reward catalogs differ: frontend={js_items}, server={worker_catalog}"
          )
          print("Responsive UI, multilingual AI and reward catalog checks passed.")
          PY
      - name: Validate all D1 migrations and XP safeguards
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(Path("worker/migrations").glob("*.sql"))
          assert len(migrations) >= 3, "Expected all versioned D1 migrations"
          for migration in migrations:
              db.executescript(migration.read_text(encoding="utf-8"))

          tables = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          expected = {
              "users", "sessions", "user_data", "rate_limits",
              "friend_requests", "xp_ledger"
          }
          assert expected <= tables, f"Missing tables: {sorted(expected - tables)}"

          user_columns = {row[1] for row in db.execute("PRAGMA table_info(users)")}
          required_user_columns = {
              "id", "name", "username", "email", "password_hash",
              "password_salt", "password_iterations", "birthdate",
              "age_band", "terms_accepted_at", "xp_balance"
          }
          assert required_user_columns <= user_columns, (
              f"Missing user columns: {sorted(required_user_columns - user_columns)}"
          )

          db.execute(
              "INSERT INTO users (id,name,username,email,age_band,terms_accepted_at,"
              "password_hash,password_salt,password_iterations,created_at,updated_at) "
              "VALUES ('u1','Test','test_user','test@example.com','adult','now','hash','salt',210000,'now','now')"
          )
          db.execute(
              "INSERT INTO xp_ledger (id,user_id,task_id,xp,award_date,reason,created_at) "
              "VALUES ('x1','u1','task_12345678',15,'2026-11-04','Task','now')"
          )
          try:
              db.execute(
                  "INSERT INTO xp_ledger (id,user_id,task_id,xp,award_date,reason,created_at) "
                  "VALUES ('x2','u1','task_87654321',16,'2026-11-04','Task','now')"
              )
              raise AssertionError("XP ledger accepted more than 15 XP for one task")
          except sqlite3.IntegrityError:
              pass

          try:
              db.execute(
                  "INSERT INTO xp_ledger (id,user_id,task_id,xp,award_date,reason,created_at) "
                  "VALUES ('x3','u1','task_12345678',5,'2026-11-04','Duplicate','now')"
              )
              raise AssertionError("XP ledger accepted a duplicate award for one task")
          except sqlite3.IntegrityError:
              pass

          assert not list(db.execute("PRAGMA foreign_key_check")), "Foreign key check failed"
          print("All D1 migrations and XP safeguards passed.")
          PY

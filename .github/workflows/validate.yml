name: SmartGoal validation

on:
  push:
    branches:
      - smartgoal/cloudflare-upgrade
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check worker/index.js
          node --check "functions/api/[[path]].js"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate responsive UI, multilingual AI and reward catalog
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          script = Path("script.js").read_text(encoding="utf-8")
          worker = Path("worker/index.js").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")

          assert css.count("{") == css.count("}"), "CSS braces are unbalanced"
          for breakpoint in ("max-width: 1100px", "max-width: 760px", "max-width: 430px", "max-width: 340px"):
              assert breakpoint in css, f"Missing responsive breakpoint: {breakpoint}"
          assert "prefers-reduced-motion: reduce" in css, "Reduced-motion support is missing"
          assert "viewport-fit=cover" in html, "Mobile safe-area viewport support is missing"

          assert "translationOriginalText = new WeakMap()" in script, "Language switching source-text cache is missing"
          assert 'name="estimatedMinutes"' in script and 'name="priority"' in script, "AI task-scoring inputs are missing"
          assert "async function generateDailyAdvice()" in script, "Personal AI coaching action is missing"
          assert "async function generateRoutine()" in script, "AI routine builder is missing"
          assert "45 XP" not in script and "45-COALESCE" not in worker, "A daily XP cap is still present"
          assert "rawDifficulty=scoreValue" in worker, "Robust AI score parsing is missing"
          assert "Vazifa nomi va izohi o‘zbek, rus, ingliz yoki boshqa tilda" in worker, "Multilingual task evaluation is missing"

          js_items = dict((item_id, int(price)) for item_id, price in re.findall(
              r'id:\s*"([^"]+)"[\s\S]*?price:\s*(\d+)', script
          ))
          worker_catalog = dict((item_id, int(price)) for item_id, price in re.findall(
              r'"([^"]+)":\{price:(\d+),type:', worker
          ))
          assert js_items, "Frontend reward catalog could not be read"
          assert js_items == worker_catalog, (
              f"Frontend/server reward catalogs differ: frontend={js_items}, server={worker_catalog}"
          )
          print("Responsive UI, multilingual AI and reward catalog checks passed.")
          PY
      - name: Validate all D1 migrations and XP safeguards
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          migrations = sorted(Path("worker/migrations").glob("*.sql"))
          assert len(migrations) >= 3, "Expected all versioned D1 migrations"
          for migration in migrations:
              db.executescript(migration.read_text(encoding="utf-8"))

          tables = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          expected = {
              "users", "sessions", "user_data", "rate_limits",
              "friend_requests", "xp_ledger"
          }
          assert expected <= tables, f"Missing tables: {sorted(expected - tables)}"

          user_columns = {row[1] for row in db.execute("PRAGMA table_info(users)")}
          required_user_columns = {
              "id", "name", "username", "email", "password_hash",
              "password_salt", "password_iterations", "birthdate",
              "age_band", "terms_accepted_at", "xp_balance"
          }
          assert required_user_columns <= user_columns, (
              f"Missing user columns: {sorted(required_user_columns - user_columns)}"
          )

          db.execute(
              "INSERT INTO users (id,name,username,email,age_band,terms_accepted_at,"
              "password_hash,password_salt,password_iterations,created_at,updated_at) "
              "VALUES ('u1','Test','test_user','test@example.com','adult','now','hash','salt',210000,'now','now')"
          )
          db.execute(
              "INSERT INTO xp_ledger (id,user_id,task_id,xp,award_date,reason,created_at) "
              "VALUES ('x1','u1','task_12345678',15,'2026-11-04','Task','now')"
          )
          try:
              db.execute(
                  "INSERT INTO xp_ledger (id,user_id,task_id,xp,award_date,reason,created_at) "
                  "VALUES ('x2','u1','task_87654321',16,'2026-11-04','Task','now')"
              )
              raise AssertionError("XP ledger accepted more than 15 XP for one task")
          except sqlite3.IntegrityError:
              pass

          try:
              db.execute(
                  "INSERT INTO xp_ledger (id,user_id,task_id,xp,award_date,reason,created_at) "
                  "VALUES ('x3','u1','task_12345678',5,'2026-11-04','Duplicate','now')"
              )
              raise AssertionError("XP ledger accepted a duplicate award for one task")
          except sqlite3.IntegrityError:
              pass

          assert not list(db.execute("PRAGMA foreign_key_check")), "Foreign key check failed"
          print("All D1 migrations and XP safeguards passed.")
          PY
